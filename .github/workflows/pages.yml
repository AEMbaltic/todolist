name: Deploy board to GitHub Pages

# The board is plain HTML/CSS/JS with no build step, so this just uploads
# the repository as-is. It runs on every push to the default branch —
# including the commits the board itself makes when it saves to
# data/board.json — so the published page always serves current data.

on:
  push:
    branches: [claude/interactive-client-task-board-z7w3uz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A save from the board can land while an earlier deploy is still running.
# Superseding it is correct here: the newest commit is the one to publish.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
